[project]
name = "python-downloader"
version = "0.1.0"
description = "多线程大文件下载工具，支持断点续传、进度显示和校验功能"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.32.0",
    "tqdm>=4.67.0",
    "colorama>=0.4.6",
    "filelock>=3.20.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "flake8>=6.0.0",
    "black>=23.0.0",
]

[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"
